services:
  # ------------------------------------------------------------ MySQL
  mysql:
    image: mysql:8.0
    container_name: ledger-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ledger_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expense_tracker}
      MYSQL_USER: ${MYSQL_USER:-ledger}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ledger_pwd}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # 宿主机端口默认 3307，避免与本机已装的 MySQL(3306) 冲突
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ledger-net

  # ------------------------------------------------------------ 后端 Bun + Hono
  server:
    build:
      # 构建上下文是仓库根：server 依赖 packages/shared，必须一起进上下文
      context: .
      dockerfile: server/Dockerfile
    image: expense-tracker-server:1.0.0
    container_name: ledger-server
    restart: unless-stopped
    environment:
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-expense_tracker}
      DB_USER: ${MYSQL_USER:-ledger}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ledger_pwd}
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ledger-net

  # ------------------------------------------------------------ 前端 nginx + React 静态资源
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: expense-tracker-frontend:1.0.0
    container_name: ledger-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - ledger-net

volumes:
  mysql-data:
    name: ledger-mysql-data

networks:
  ledger-net:
    name: ledger-net
    driver: bridge
